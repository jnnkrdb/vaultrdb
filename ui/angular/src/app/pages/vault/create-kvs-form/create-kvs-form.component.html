<div>
  <div mat-dialog-content>
    <h6>Create a new KeyValueSet</h6>
  </div>
  <div>
    <mat-form-field class="full-width">
      <mat-label>Key</mat-label>
      <input matInput required type="text" [(ngModel)]="newKVS.key" (input)="replaceUnwantedCharacters()"/>
      @if (newKVS.key) {
        <button matSuffix mat-icon-button aria-label="Clear" (click)="newKVS.key=''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <!-- style="margin-left: 1rem; min-width: 50%;" -->
    <mat-form-field class="full-width">
      <mat-label>Value</mat-label>
      <textarea matInput type="text" rows="5" [(ngModel)]="newKVS.value"></textarea>
      @if (newKVS.value) {
        <button matSuffix mat-icon-button aria-label="Clear" (click)="newKVS.value=''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput type="text" rows="5" [(ngModel)]="newKVS.description"></textarea>
      @if (newKVS.description) {
        <button matSuffix mat-icon-button aria-label="Clear" (click)="newKVS.description=''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button mat-button (click)="submit()">Submit</button>
    <button mat-button mat-dialog-close cdkFocusInitial>Close</button>
  </div>
</div>
