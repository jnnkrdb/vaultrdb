<section>
  <div>
    <button mat-stroked-button (click)="openCreateKVSForm()">Create KeyValueSet</button>
  </div>
</section>

<div class="mat-elevation-z8 scroll-container">
  <table mat-table [dataSource]="dataSource" multiTemplateDataRows>

    <!-- key Column -->
    <ng-container matColumnDef="key">
      <th mat-header-cell *matHeaderCellDef> Key </th>
      <td mat-cell *matCellDef="let element">{{element.key}}</td>
    </ng-container>

    <!-- description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let element">
        {{element.description}}
      </td>
    </ng-container>

    <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
        <div class="element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
          
          <div class="container">
            <div class="row">
              <mat-form-field class="full-width">
                <mat-label>Description</mat-label>
                <textarea matInput rows="3" type="text" [(ngModel)]="element.description"></textarea>
              </mat-form-field>
            </div>

            <div class="row">
              <mat-form-field class="full-width">
                <mat-label>Value</mat-label>
                <textarea matInput rows="7" type="text" [(ngModel)]="element.value"></textarea>
              </mat-form-field>
            </div>
            
            <div class="row" style="margin-bottom: 1rem;">
              <p style="width: 10rem; height: 3rem;">
                <mat-slide-toggle>Slide me!</mat-slide-toggle>
              </p>
              <button style="width: 10rem; height: 3rem;" mat-stroked-button (click)="saveKVS(element)">Submit</button>
              <button style="width: 10rem; height: 3rem;" mat-stroked-button (click)="deleteKVS(element)">Delete</button>
            </div>
          </div>

        </div>    
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let element; columns: displayedColumns;" 
        class="element-row" 
        [class.expanded-row]="expandedElement === element"
        (click)="expandedElement = expandedElement === element ? null : element">
    </tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
  </table>
</div>
