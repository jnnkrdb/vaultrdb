<div>
  <h6>Create a new KeyValueSet:</h6>
  <mat-form-field>
    <mat-label>Key</mat-label>
    <input matInput type="text" [(ngModel)]="_key"/>
  </mat-form-field>

  <mat-form-field style="margin-left: 1rem; min-width: 50%;">
    <mat-label>Value</mat-label>
    <input matInput type="text" [(ngModel)]="_value"/>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Description</mat-label>
    <input matInput type="text" [(ngModel)]="_description"/>
    @if (_description) {
      <button matSuffix mat-icon-button aria-label="Clear" (click)="_description=''">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <button mat-button (click)="submit()">Submit</button>
</div>
