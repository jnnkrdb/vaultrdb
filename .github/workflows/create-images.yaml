name: CREATE IMAGES ON MASTER

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches: 
      - master 

env:
  HELM_EXPERIMENTAL_OCI: 1 #enable OCI support

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id:   gitversion # id to later be referenced
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true
        configFilePath: .github/gitversion/GitVersion.yml

    - name: bash-version
      run: |
        echo ${{ steps.gitversion.outputs.semVer }} > ./base/vaultrdb/config/VERSION
        echo $(cat './base/vaultrdb/config/VERSION')

#    - name: Set up Docker Buildx
#      id: buildx
#      uses: docker/setup-buildx-action@v2

    - name: Login to Github Packages
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHP_TOKEN }}

    - name: Build Image Without Push
      uses: docker/build-push-action@v5
      if: github.event_name == 'pull_request'
      with:
        context: "."
        file: "Dockerfile"
        #tags: jnnkrdb/vaultrdb:operator-latest,jnnkrdb/vaultrdb:operator-${{ steps.gitversion.outputs.semVer }}
        push: false
    
    - name: Build Image With Push - Dev
      uses: docker/build-push-action@v5
      if: github.ref == 'refs/heads/dev'
      with:
        context: "."
        file: "Dockerfile"
        tags: jnnkrdb/vaultrdb:dev-latest
        push: true

    - name: Build Image With Push - Prod
      uses: docker/build-push-action@v5
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      with:
        context: "."
        file: "Dockerfile"
        tags: jnnkrdb/vaultrdb:latest,jnnkrdb/vaultrdb:${{ steps.gitversion.outputs.semVer }}
        push: true






