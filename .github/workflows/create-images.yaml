name: CREATE IMAGES ON MASTER

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '.devcontainer/**'
      - '.docs/**'
      - '.github/oldsrc/**'
      - '.github/HELP.md'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: 
      - master 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        with:
          # Change this to point to your image name
          imageName: ghcr.io/jnnkrdb/vaultrdb-devcontainer
          # Change this to be your CI task/script
          runCmd: |
            # Add multiple commands to run if needed
            operator-sdk version
            go version
            npm version

env:
  HELM_EXPERIMENTAL_OCI: 1 #enable OCI support

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'
          
      - name: Determine Version
        id:   gitversion # id to later be referenced
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: .github/gitversion/GitVersion.yml
      
      - id: version
        run: echo "semver=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT

  build-vault:
    needs: version
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ghcr.io/jnnkrdb/vaultrdb/vrdb-vault
      DOCKERFILE: ./vrdb-vault.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: bash-version
        run: |
          echo ${{ needs.version.outputs.semver }} > ./vaultrdb/config/VERSION
          echo $(cat './vaultrdb/config/VERSION')

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Build Image Without Push
        uses: docker/build-push-action@v5
        if: github.event_name == 'pull_request'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          #tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: false
      
      - name: Build Image With Push - Dev
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/dev'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:dev
          push: true

      - name: Build Image With Push - Prod
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: true

  build-injector:
    needs: version
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ghcr.io/jnnkrdb/vaultrdb/vrdb-injector
      DOCKERFILE: ./vrdb-injector.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: bash-version
        run: |
          echo ${{ needs.version.outputs.semver }} > ./vaultrdb/config/VERSION
          echo $(cat './vaultrdb/config/VERSION')

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Build Image Without Push
        uses: docker/build-push-action@v5
        if: github.event_name == 'pull_request'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          #tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: false
      
      - name: Build Image With Push - Dev
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/dev'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:dev
          push: true

      - name: Build Image With Push - Prod
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: true

  build-operator: 
    needs: version
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ghcr.io/jnnkrdb/vaultrdb/vrdb-operator
      DOCKERFILE: ./vrdb-operator.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: bash-version
        run: |
          echo ${{ needs.version.outputs.semver }} > ./vaultrdb/config/VERSION
          echo $(cat './vaultrdb/config/VERSION')

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Build Image Without Push
        uses: docker/build-push-action@v5
        if: github.event_name == 'pull_request'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          #tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: false
      
      - name: Build Image With Push - Dev
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/dev'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:dev
          push: true

      - name: Build Image With Push - Prod
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          context: "."
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.REPOSITORY }}:latest,${{ env.REPOSITORY }}:${{ needs.version.outputs.semver }}
          push: true
