name: CREATE IMAGES ON MASTER

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master 

env:
  HELM_EXPERIMENTAL_OCI: 1 #enable OCI support

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id:   gitversion # id to later be referenced
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true
        configFilePath: .github/gitversion/GitVersion.yml

    - name: bash-version
      run: |
        echo ${{ steps.gitversion.outputs.semVer }} > ./base/vaultrdb/config/VERSION

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Github Packages
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHP_TOKEN }}
        
# -------------------------------------------------------------------------------------- 
# building the images for the service as a pr and a release

# ----------------- base image
    - name: Build Image Without Push - Base
      uses: docker/build-push-action@v5
      with:
        context: "./base/"
        tags: vaultrdbbase:latest
        push: false
# ----------------- operator image
    - name: Build Image Without Push - Operator
      uses: docker/build-push-action@v5
      if: github.event_name == 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/Operator.Dockerfile"
        #tags: jnnkrdb/vaultrdb:operator-latest,jnnkrdb/vaultrdb:operator-${{ steps.gitversion.outputs.semVer }}
        push: false

    - name: Build Image With Push - Operator
      uses: docker/build-push-action@v5
      if: github.event_name != 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/Operator.Dockerfile"
        tags: jnnkrdb/vaultrdb:operator-latest,jnnkrdb/vaultrdb:operator-${{ steps.gitversion.outputs.semVer }}
        push: true
# ----------------- storageapi image
    - name: Build Image Without Push - StorageAPI
      uses: docker/build-push-action@v5
      if: github.event_name == 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/StorageAPI.Dockerfile"
        #tags: jnnkrdb/vaultrdb:storageapi-latest,jnnkrdb/vaultrdb:storageapi-${{ steps.gitversion.outputs.semVer }}
        push: false

    - name: Build Image With Push - StorageAPI
      uses: docker/build-push-action@v5
      if: github.event_name != 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/StorageAPI.Dockerfile"
        tags: jnnkrdb/vaultrdb:storageapi-latest,jnnkrdb/vaultrdb:storageapi-${{ steps.gitversion.outputs.semVer }}
        push: true
# ----------------- frontend image
    - name: Build Image Without Push - UiServer
      uses: docker/build-push-action@v5
      if: github.event_name == 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/UiServer.Dockerfile"
        #tags: jnnkrdb/vaultrdb:storageapi-latest,jnnkrdb/vaultrdb:storageapi-${{ steps.gitversion.outputs.semVer }}
        push: false

    - name: Build Image With Push - UiServer
      uses: docker/build-push-action@v5
      if: github.event_name != 'pull_request'
      with:
        context: "./vrdb/"
        file: "./vrdb/UiServer.Dockerfile"
        tags: jnnkrdb/vaultrdb:uiserver-latest,jnnkrdb/vaultrdb:uiserver-${{ steps.gitversion.outputs.semVer }}
        push: true






