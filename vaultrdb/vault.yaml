setup:
  replicas: 1
  namespace: default
  servicename: vaulth # this is the headless service of the vault statefulset
  clusterinternalurl: cluster.local
  externalapi:
    frontendui:
      enabled: false
    swaggerui:
      enabled: false
log:
  level: error
  formatjson: true
authz:
  enabled: false
  storage:
    type: cache
configs:
  enabled: false
  storage:
    type: cache
vault:
  enabled: true
  storage:
    type: cache